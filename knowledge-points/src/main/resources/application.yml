server:
  port: 8082

spring:
  application:
    name: knowledge-points
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/knowledge_points?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:knowledge}
    password: ${RABBIT_PASSWORD:knowledge}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: true
  flyway:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.knowledge.points.signin.controller,com.knowledge.points.ranking.controller,com.knowledge.points.season.controller
  paths-to-match: /api/points/**

knowledge:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: knowledge-iam
  points:
    task:
      fixed-delay: 5000
  xxl:
    enabled: ${XXL_JOB_ENABLED:false}
    admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8080/xxl-job-admin}
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}
    app-name: knowledge-points
    port: ${XXL_JOB_PORT:9999}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}

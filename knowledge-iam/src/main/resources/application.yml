server:
  port: 8083

spring:
  application:
    name: knowledge-iam
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  datasource:
    url: ${IAM_DB_URL:jdbc:mysql://localhost:3307/knowledge_iam?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${IAM_DB_USERNAME:root}
    password: ${IAM_DB_PASSWORD:root}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

knowledge:
  storage:
    enabled: ${OBJECT_STORAGE_ENABLED:true}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:knowledge}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:knowledge-secret}
    bucket: ${OBJECT_STORAGE_BUCKET:knowledge-avatar}
  security:
    web:
      cookie-secure: ${WEB_AUTH_COOKIE_SECURE:true}
      allowed-origins: ${WEB_AUTH_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
    jwt:
      secret: ${JWT_SECRET}
      issuer: knowledge-iam
      access-token-ttl: 30m
      refresh-token-ttl: 30d
    m2m:
      issuer: ${IAM_M2M_ISSUER:http://localhost:8083}
      # PKCS#8 RSA private key supplied by the deployment secret store; IAM alone can read it.
      rsa-private-key: ${M2M_JWT_PRIVATE_KEY}
      key-id: ${M2M_JWT_KEY_ID:iam-m2m-2026-01}
      agent-client-id: ${AGENT_M2M_CLIENT_ID:knowledge-agent}
      agent-client-secret: ${AGENT_M2M_CLIENT_SECRET}
      access-token-ttl: ${M2M_ACCESS_TOKEN_TTL:5m}
      audience: knowledge-learning

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}

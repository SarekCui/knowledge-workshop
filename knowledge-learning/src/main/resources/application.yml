server:
  port: 8084

spring:
  application:
    name: knowledge-learning
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  datasource:
    url: ${LEARNING_DB_URL:jdbc:mysql://localhost:3307/knowledge_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${LEARNING_DB_USERNAME:root}
    password: ${LEARNING_DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:knowledge}
    password: ${RABBITMQ_PASSWORD:knowledge}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  flyway:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.knowledge.learning
  paths-to-match: /api/learning/**

knowledge:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: knowledge-iam

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}

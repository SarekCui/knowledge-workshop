server:
  port: 8084

spring:
  application:
    name: knowledge-learning
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  datasource:
    url: ${LEARNING_DB_URL:jdbc:mysql://localhost:3307/knowledge_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${LEARNING_DB_USERNAME:root}
    password: ${LEARNING_DB_PASSWORD:root}
  data:
    redis:
      connect-timeout: 1s
      timeout: 1s
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    connection-timeout: 5s
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:knowledge}
    password: ${RABBITMQ_PASSWORD:knowledge}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.knowledge.learning
  paths-to-match: /api/learning/**

knowledge:
  storage:
    enabled: ${OBJECT_STORAGE_ENABLED:true}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:knowledge}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:knowledge-secret}
    bucket: ${NOTE_OBJECT_STORAGE_BUCKET:knowledge-note}
  learning:
    note-image:
      cleanup-delay: ${NOTE_IMAGE_CLEANUP_DELAY:1h}
    agent-mention:
      dispatch-delay: ${AGENT_MENTION_DISPATCH_DELAY:5000}
      confirm-timeout-ms: ${AGENT_MENTION_CONFIRM_TIMEOUT_MS:5000}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: knowledge-iam
    m2m:
      issuer: ${IAM_M2M_ISSUER:http://localhost:8083}
      jwk-set-uri: ${IAM_M2M_JWK_SET_URI:http://localhost:8083/oauth2/jwks}
      expected-audience: knowledge-learning

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
